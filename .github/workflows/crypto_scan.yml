name: Crypto Scanner

on:
  workflow_dispatch:

  schedule:
    # हर 1 घंटे में
    - cron: "*/60 * * * *"

jobs:

  crypto_scan:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =====================================================
      # STEP 1: CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # STEP 2: SETUP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # STEP 3: INSTALL LIBRARIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # STEP 4: RUN CRYPTO SCANNER
      # =====================================================

      - name: Run Crypto Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python crypto_scanner.py


      # =====================================================
      # STEP 5: SAVE CRYPTO COOLDOWN FILE
      # =====================================================

      - name: Save Crypto Alert File
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add crypto_sent_alerts.json

          git diff --cached --quiet || git commit -m "update crypto alerts [skip ci]"

          git pull --rebase origin main

          git push
