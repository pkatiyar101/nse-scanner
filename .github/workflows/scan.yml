name: NSE Scanner

on:
  schedule:
    # 9:15–9:45 AM IST = 03:45–04:15 UTC
    - cron: "45 3 * * 1-5"
    - cron: "0,15 4 * * 1-5"

    # 10:00 AM–2:45 PM IST = 04:30–09:15 UTC
    - cron: "*/15 4-9 * * 1-5"

    # 3:00–3:30 PM IST = 09:30–10:00 UTC
    - cron: "30,45 9 * * 1-5"
    - cron: "0 10 * * 1-5"

  workflow_dispatch:

# Only one scanner should modify the output files at a time.
# A new manual or scheduled run cancels an older active/pending run.
concurrency:
  group: nse-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tvscreener==0.5.2" pandas requests

      - name: Run NSE scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Save sent alerts state and news analysis
        if: always()
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
          fi

          if [ -f Stocks_News_Analysis.csv ]; then
            git add Stocks_News_Analysis.csv
          fi

          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
            exit 0
          fi

          git commit -m "update alerts and news analysis [skip ci]"
          git push origin HEAD:"$BRANCH_NAME"
