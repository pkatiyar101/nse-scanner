name: NSE Scanner

on:
  # Runs every 15 minutes from 9:15 AM to 3:30 PM IST, Monday to Friday
  # GitHub cron is in UTC.
  # IST = UTC + 5:30
  # 9:15 AM IST = 3:45 AM UTC
  # 3:30 PM IST = 10:00 AM UTC
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

# Prevent two scanner jobs from modifying sent_alerts.json at the same time.
concurrency:
  group: nse-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tvscreener==0.5.2" pandas requests

      - name: Run NSE scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Save sent alerts state
        if: always()
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
          fi

          if git diff --cached --quiet; then
            echo "No sent_alerts.json changes to commit."
            exit 0
          fi

          git commit -m "update alerts [skip ci]"
          git push origin HEAD:"$BRANCH_NAME"
