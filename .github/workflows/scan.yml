name: NSE Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  #on:
 # schedule:
    # Runs ~2 minutes AFTER each 15-minute candle closes (candles close at
    # IST :00/:15/:30/:45). UTC minute + 30 = IST minute, so UTC :02,:17,:32,:47
    # equals IST :32,:47,:02,:17.
    # First run 04:02 UTC = 09:32 IST, last run 10:02 UTC = 15:32 IST.
   # - cron: "2,17,32,47 4-9 * * 1-5"
   # - cron: "2 10 * * 1-5"

  

concurrency:
  group: nse-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run NSE scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner.py

      - name: Save sent alerts state and news analysis
        if: always()
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
          fi

          if [ -f Stocks_News_Analysis.csv ]; then
            git add Stocks_News_Analysis.csv
          fi

          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
            exit 0
          fi

          git commit -m "update alerts and news analysis [skip ci]"

          # Retry push in case another commit landed on the branch meanwhile
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH_NAME" || true
            if git push origin HEAD:"$BRANCH_NAME"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts"
          exit 1
