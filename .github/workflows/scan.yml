name: NSE Scanner

on:
  schedule:
    # हर 15 मिनट, IST 9:15 AM से 3:30 PM तक (UTC 3:45 से 10:00 तक)
    # minute offset 7,22,37,52 से भीड़ कम होती है
    - cron: "7,22,37,52 3-9 * * 1-5"
    - cron: "7 10 * * 1-5"

  workflow_dispatch:

concurrency:
  group: nse-scanner
  cancel-in-progress: false    # ← इसे false करें

jobs:
  #scan:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tvscreener==0.5.2" pandas requests

      - name: Run NSE scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Save sent alerts state and news analysis
        if: always()
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
          fi

          if [ -f Stocks_News_Analysis.csv ]; then
            git add Stocks_News_Analysis.csv
          fi

          if git diff --cached --quiet; then
            echo "No scanner output changes to commit."
            exit 0
          fi

          git commit -m "update alerts and news analysis [skip ci]"
          git push origin HEAD:"$BRANCH_NAME"
